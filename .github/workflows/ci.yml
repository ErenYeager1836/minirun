name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libelf-dev zlib1g-dev clang iproute2 python3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo Check
        run: cargo check --verbose
      - name: Cargo Test
        run: cargo test --verbose
      - name: Cargo Clippy
        run: cargo clippy -- -D warnings
      - name: Build Binary
        run: cargo build
      - name: Inspect Runner Kernel & Cgroups v2
        run: |
          echo "### Runner Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Release:** \`$(uname -r)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **BTF Path:** \`$(ls -la /sys/kernel/btf/vmlinux 2>/dev/null || echo 'BTF missing')\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cgroup Filesystem:** \`$(stat -fc %T /sys/fs/cgroup 2>/dev/null || echo 'stat failed')\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cgroup v2 Controllers:** \`$(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo 'missing')\`" >> $GITHUB_STEP_SUMMARY
          uname -r
          ls -la /sys/kernel/btf/vmlinux || echo "BTF missing"
          stat -fc %T /sys/fs/cgroup || echo "stat failed"
          cat /sys/fs/cgroup/cgroup.controllers || echo "cgroup.controllers missing"
      - name: Run Guard Integration Tests (sudo)
        run: |
          sudo -E ./tests/test_guard.sh 2>&1 | tee test_guard.log
      - name: Run Seccomp Integration Tests (sudo)
        run: |
          sudo -E ./tests/test_seccomp.sh 2>&1 | tee test_seccomp.log
      - name: Publish Test Summary
        if: always()
        run: |
          echo "### Guard Integration Test Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_guard.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No test log found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Seccomp Integration Test Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_seccomp.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No test log found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
